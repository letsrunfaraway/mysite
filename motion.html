       slot with a real player and keep the ratio class:

       <video class="ratio-169" controls playsinline poster="assets/img/ph-wide.svg">
         <source src="assets/video/your-film.mp4" type="video/mp4">
       </video>

          <figcaption class="media-caption">Film placeholder 01</figcaption>

          <figcaption class="media-caption">Film placeholder 04</figcaption>
        </figure>

      </div>
    </div>

    </div>
  </section>

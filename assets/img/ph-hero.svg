<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" width="2400" height="1400" role="img" aria-label="Hero image placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e4e4"/>
      <stop offset="0.55" stop-color="#dcdcdc"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <pattern id="hatch" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#d2d2d2" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="2400" height="1400" fill="url(#g)"/>
  <rect width="2400" height="1400" fill="url(#hatch)" opacity="0.55"/>

  <!-- Label sits low so it never collides with the headline above it -->
  <text x="1200" y="1270" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="34"
        letter-spacing="10" fill="#9a9a9a">HERO IMAGE PLACEHOLDER</text>
  <text x="1200" y="1322" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="25"
        letter-spacing="7" fill="#a8a8a8">2400 &#215; 1400</text>
</svg>

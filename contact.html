<main>

  <section class="section" style="padding-top: calc(var(--header-h) + clamp(60px, 9vw, 120px))">
    <div class="wrap">

      <h1 class="contact-lede reveal">Lets Work Together.</h1>
      <p class="contact-email reveal">
        Email: <a href="mailto:Letsrunfarway@gmail.com">Letsrunfarway@gmail.com</a>
      </p>

      <!-- Contact form ------------------------------------------------------
           This is a static site, so there is no server to receive a post.
           As shipped, Send opens the visitor's mail client with the message
           prefilled. To collect submissions properly, point the form at a
           form service and delete the inline script at the bottom, e.g.

             <form class="form" action="https://formspree.io/f/YOUR_ID" method="POST">
      -------------------------------------------------------------------------->
      <p class="section__label reveal">Contact Form</p>

      <form class="form reveal" id="contact-form" novalidate>

        <div class="form__row">
          <div class="field">
            <label for="first">First Name</label>
            <input type="text" id="first" name="first" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="last">Last Name</label>
            <input type="text" id="last" name="last" autocomplete="family-name" required>
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <div class="form__actions">
          <button class="btn" type="submit">Send</button>
        </div>

        <p class="form__note" id="form-note" role="status"></p>
      </form>

    </div>
  </section>

</main>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script src="assets/js/main.js"></script>
<script>
/* Static fallback: hand the message to the visitor's mail client.
   Delete this block once the form posts to a real endpoint. */
(function () {
  var form = document.getElementById("contact-form");
  var note = document.getElementById("form-note");
  if (!form) return;

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var first = form.first.value.trim();
    var last = form.last.value.trim();
    var email = form.email.value.trim();
    var message = form.message.value.trim();

    if (!first || !last || !email || !message) {
      note.textContent = "Please fill in every field.";
      return;
    }

    var subject = "Website enquiry from " + first + " " + last;
    var body = message + "\n\n" + first + " " + last + "\n" + email;

    note.textContent = "Opening your mail app...";
    window.location.href =
      "mailto:Letsrunfarway@gmail.com?subject=" +
      encodeURIComponent(subject) +
      "&body=" +
      encodeURIComponent(body);
  });
})();
</script>
</body>
